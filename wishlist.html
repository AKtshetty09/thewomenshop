  <!-- Visitor statistics (Umami: no cookies, no personal data) -->

  <!-- Link preview (WhatsApp, Instagram, Facebook) -->
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="css/style.css?v=20261102a">
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding-bottom: 80px">
    <div class="page-head">
      <div class="crumbs"><a href="index.html">Home</a> / Wishlist</div>
      <h1>My Wishlist <small id="count"></small></h1>
    </div>
    <div class="grid" id="wishlist" style="margin-top: 24px"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js?v=20261102a"></script>
  <script src="js/data.js?v=20261102a"></script>
  <script src="js/common.js?v=20261102a"></script>
  <script>
    (function () {
      const { icon, productCard, Wishlist } = window.TWS;
      const box = document.getElementById("wishlist");
      function render(products) {
        const list = Wishlist.all().map((id) => products.find((p) => p.id === id)).filter(Boolean);
        document.getElementById("count").textContent = list.length ? `${list.length} item${list.length === 1 ? "" : "s"}` : "";
        box.innerHTML = list.length ? list.map(productCard).join("") : `
          <div class="empty no-results">
            ${icon("heart", "ico-xl")}
            <h4>Your wishlist is empty</h4>
            <p>Tap the ♥ on any product to save it here.</p>
            <a class="btn" href="shop.html">Explore styles</a>
          </div>`;
      }
      window.loadProducts().then((products) => {
        render(products);
        document.addEventListener("wishlist:change", () => render(products));
      });
    })();
  </script>
</body>
</html>
