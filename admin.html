<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kavya's Shop | The Women Shop</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <!-- "Add to Home Screen" turns this page into the Kavya's Shop app -->
  <link rel="manifest" href="/admin.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kavya's Shop">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/admin-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261103e">
</head>
<body class="adm">
  <header class="adm-bar">
    <img src="assets/logo.jpg" alt="The Women Shop">
    <span class="adm-title">Kavya's Shop</span>
    <button class="adm-logout" id="logout" hidden>Log out</button>
  </header>

  <main class="adm-main" id="admin"></main>

  <nav class="adm-tabs" id="tabs" hidden aria-label="Admin sections">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button type="button" data-tab="products">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 4 2-2 4-2-1v10H8V11l-2 1-2-4 4-2z"/></svg>Products</button>
    <button type="button" data-tab="orders">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Orders<b id="tab-badge-orders" hidden></b></button>
    <button type="button" data-tab="reviews">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>Reviews<b id="tab-badge" hidden></b></button>
    <button type="button" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
  </nav>

  <div class="toast" id="adm-toast"></div>

  <script src="js/config.js?v=20261103e"></script>
  <script src="js/data.js?v=20261103e"></script>
  <script src="js/admin.js?v=20261103e"></script>
</body>
</html>
