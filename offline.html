<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline | The Women Shop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #000; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    img { width: min(260px, 70vw); }
    h1 { margin: 18px 0 8px; font-family: Georgia, serif; font-size: 26px; font-weight: 600; }
    p { margin: 0 auto 24px; max-width: 320px; color: rgba(255, 255, 255, .75); line-height: 1.5; }
    button { padding: 13px 30px; border: 0; border-radius: 999px; background: #e0336f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.jpg" alt="The Women Shop">
    <h1>You're offline</h1>
    <p>Please check your internet connection. Your bag and wishlist are safe on this phone.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
